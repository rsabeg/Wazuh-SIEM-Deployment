<ossec_config>

  <!-- =========================================================
       GLOBAL SETTINGS
       ========================================================= -->
  <global>
    <jsonout_output>yes</jsonout_output>         <!-- Output alerts as JSON -->
    <alerts_log>yes</alerts_log>                 <!-- Write alerts.log -->
    <logall>no</logall>                          <!-- Log all events (not just alerts) — set yes for full audit -->
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>  <!-- [RECOMMENDED] Set yes + configure SMTP for alert emails -->
    <smtp_server>smtp.example.com</smtp_server>
    <email_from>wazuh@example.com</email_from>
    <email_to>admin@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>


  <!-- =========================================================
       ALERTS CONFIGURATION
       ========================================================= -->
  <alerts>
    <log_alert_level>3</log_alert_level>          <!-- Min rule level to log (0-15) -->
    <email_alert_level>12</email_alert_level>      <!-- Min level to trigger email -->
  </alerts>


  <!-- =========================================================
       LOGGING
       ========================================================= -->
  <logging>
    <log_format>plain</log_format>
  </logging>


  <!-- =========================================================
       REMOTE — AGENT COMMUNICATION
       [LAB DEFAULT] Port 1514, UDP
       ========================================================= -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>                      <!-- [RECOMMENDED] TCP over UDP for reliability -->
    <queue_size>131072</queue_size>
  </remote>


  <!-- =========================================================
       RULESET
       ========================================================= -->
  <ruleset>
    <!-- Default rules -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>

    <!-- Custom rules — add your own rules here -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>


  <!-- =========================================================
       FILE INTEGRITY MONITORING (FIM / SysCheck)
       [RECOMMENDED] Monitor critical directories
       ========================================================= -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>                  <!-- Scan every 12 hours -->
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Monitor Wazuh config files (detect tampering) -->
    <directories check_all="yes" report_changes="yes" realtime="yes">
      /var/ossec/etc
    </directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">
      /var/ossec/ruleset/rules
    </directories>

    <!-- Monitor critical OS directories -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin</directories>

    <!-- Ignore noisy paths -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
  </syscheck>


  <!-- =========================================================
       ROOTCHECK
       ========================================================= -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>


  <!-- =========================================================
       VULNERABILITY DETECTION
       [RECOMMENDED] Enable for CVE scanning
       ========================================================= -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>


  <!-- =========================================================
       LOG ANALYSIS — LOCAL LOGS ON MANAGER
       ========================================================= -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>        <!-- SSH login attempts -->
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>        <!-- Package installs/removals -->
  </localfile>

  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>                      <!-- Disk usage monitoring -->
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]*\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/'</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>                 <!-- Recent logins -->
    <frequency>360</frequency>
  </localfile>


  <!-- =========================================================
       ACTIVE RESPONSE
       [RECOMMENDED] Auto-block IPs on brute force
       ========================================================= -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- Block IPs that trigger SSH brute force rule (rule 5763) -->
  <!--
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5763</rules_id>
    <timeout>600</timeout>
  </active-response>
  -->


  <!-- =========================================================
       CLUSTER (for future multi-node deployment)
       ========================================================= -->
  <cluster>
    <name>wazuh</name>
    <node_name>master-node</node_name>
    <node_type>master</node_type>
    <key></key>                                   <!-- Set a strong key for cluster auth -->
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>NODE_IP</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>                      <!-- Enable when scaling to multi-node -->
  </cluster>

</ossec_config>

